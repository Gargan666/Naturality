plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/'
		content { includeGroup 'com.terraformersmc' }
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"naturality" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'naturality-tests'
		enableGameTests = false
		enableClientGameTests = true
		clearRunDirectory = false
	}
	configureDataGeneration {
		client = true
	}
}

// Explicit suite selection prevents a small visual change from running every test.
tasks.named('runClientGameTest') {
    systemProperty 'naturality.test.suites', providers.gradleProperty('clientTests').getOrElse('')
	systemProperty 'naturality.test.muteAudio', 'true'
	doFirst {
		def selection = systemProperties['naturality.test.suites'].toString().split(',').collect { it.trim() }
		def valid = ['wind-compat', 'snow-compat', 'chunks', 'aurora', 'rainbow', 'sky-events', 'end-flashes', 'sunset', 'glint', 'snow', 'rain-splash', 'particle-weather', 'weather-commands', 'weather', 'gameplay', 'config', 'fire', 'water', 'water-rain', 'waterfall', 'lava-effects', 'water-ripples', 'water-occlusion', 'short-distance', 'fluids', 'flame', 'leaves', 'smoke', 'clouds', 'fog', 'lighting', 'dynamic-lighting', 'portal', 'end-portal', 'audio', 'all']
		valid.add('breaking')
		valid.add('entity-shadow')
		valid.add('snow-weather')
		valid.add('snow-performance')
		valid.add('fog-culling')
		valid.add('particle-visibility')
		valid.add('villagers')
		valid.add('butcher')
        valid.add('villager-bread')
        valid.add('villager-gates')
        valid.add('villager-shelter')
        valid.add('animal-care')
        valid.add('reputation')
		valid.add('crowd-panic')
		valid.add('wind-shapes')
		valid.add('fluid-tail')
		valid.add('environment-persistence')
		valid.add('snow-worldgen')
		valid.add('lightning')
		valid.add('client-startup')
        valid.add('distortion')
        valid.add('rise')
        valid.add('starfall')
        valid.add('end-weather')
        valid.add('end-flight')
        valid.add('end-movement')
        valid.add('end-mob-ai')
		valid.add('sky-state')
        valid.add('mob-arrows')
        valid.add('fireball-model')
        valid.add('chorus-flowers')
        valid.add('smooth-endstone')
        valid.add('lirestone-worldgen')
        valid.add('end-terrain')
        valid.add('end-chunk-performance')
		if (selection.any { !valid.contains(it) }) {
			throw new GradleException('Choose relevant suites with -PclientTests=fog,lighting (available: wind-compat, snow-compat, chunks, aurora, rainbow, sky-events, end-flashes, sunset, glint, snow, rain-splash, particle-weather, weather-commands, weather, gameplay, config, fire, water, water-rain, waterfall, lava-effects, water-ripples, water-occlusion, short-distance, fluids, flame, leaves, smoke, clouds, fog, lighting, dynamic-lighting, portal, end-portal, audio; all explicitly runs everything).')
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Available in the development client without bundling it in Naturality.
	clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Optional local compatibility test dependency; never bundled in the mod.
	if (providers.gradleProperty('sodiumTestJar').isPresent()) {
		clientRuntimeOnly files(providers.gradleProperty('sodiumTestJar').get())
	}
}

def generateChorusFlowerModel = tasks.register('generateChorusFlowerModel') {
	description = 'Converts both artist chorus flower exports into game-ready models.'
	inputs.files('resources/block models/chorus_flower.json', 'resources/block models/chorus_flower_bloom.json')
	outputs.dir(layout.buildDirectory.dir('generated/chorusFlowerResources'))
	doLast {
		inputs.files.each { source ->
		def model = new groovy.json.JsonSlurper().parse(source)
		model.textures.replaceAll { key, value ->
			value.startsWith('resources:') ? value.replaceFirst('resources:', 'naturality:') : value
		}
		// Older exports leave the stem texture in the vanilla namespace.
		if (model.textures['3'] == 'block/chorus_plant') {
			model.textures['3'] = 'naturality:block/chorus_plant'
		}
		if (model.textures.particle == '#texture' && !model.textures.containsKey('texture')) {
			model.textures.particle = '#4'
		}
		model.elements.each { element ->
			element.faces.entrySet().removeIf { it.value.texture == '#missing' }
		}
		def output = new File(outputs.files.singleFile, 'assets/naturality/models/block/' + source.name)
		output.parentFile.mkdirs()
		output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(model)) + '\n', 'UTF-8')
		}
	}
}

processResources {
	from(generateChorusFlowerModel)
	// The artist texture also replaces every vanilla chorus-plant sprite reference.
	from('resources/textures/block') {
		into 'assets/minecraft/textures/block'
		include 'chorus_plant.png', 'chorus_plant.png.mcmeta'
	}
	// Artist-facing resources keep Minecraft's layout beneath the mod namespace.
	from('resources') {
		into 'assets/naturality'
		exclude '**/README.txt', '**/.gitkeep', 'block models/**'
	}

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Keep production API, type-safety and redundant-cast warnings visible in builds.
['compileJava', 'compileClientJava'].each { taskName ->
	tasks.named(taskName, JavaCompile) {
		options.compilerArgs.addAll(['-Xlint:deprecation,unchecked,cast', '-Werror'])
	}
}

tasks.register('writeJavaAuditClasspath') {
	group = 'verification'
	description = 'Exports the production classpath for scripts/check-java-warnings.ps1.'
	dependsOn tasks.named('classes')
	inputs.files(sourceSets.client.compileClasspath)
	outputs.file(layout.buildDirectory.file('java-audit/classpath.txt'))
	doLast {
		def output = outputs.files.singleFile
		output.parentFile.mkdirs()
		output.text = inputs.files.asPath
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// launch.cfg is shared by normal and alternate build directories. Refresh its
// classpath groups whenever launch setup runs, including VS Code's F5 preflight.
tasks.named('generateDLIConfig') {
	outputs.upToDateWhen { false }
}

tasks.register('prepareDebugLaunch') {
	group = 'fabric'
	description = 'Builds debug resources and refreshes/verifies Fabric launch metadata.'
	dependsOn 'classes', 'clientClasses', 'gametestClasses', 'configureClientLaunch'
	def launchConfig = layout.projectDirectory.file('.gradle/loom-cache/launch.cfg').asFile
	def modOutputs = (sourceSets.main.output.files + sourceSets.client.output.files).collect { it.absolutePath }
	doLast {
		def property = launchConfig.readLines().find { it.trim().startsWith('fabric.classPathGroups=') }
		def groups = property == null ? [] : property.trim().substring('fabric.classPathGroups='.length())
			.split(java.util.regex.Pattern.quote(File.pathSeparator + File.pathSeparator))
			.collect { it.split(java.util.regex.Pattern.quote(File.pathSeparator)).toList() }
		if (!groups.any { it.containsAll(modOutputs) }) {
			throw new GradleException('Fabric launch metadata does not group the current main/client outputs. Debug launch stopped to avoid missing shaders.')
		}
		logger.lifecycle('Verified Fabric debug classpath: main/client classes and resources belong to the same mod.')
	}
}

// VS Code's Java compiler copies source resources but does not execute our
// processResources asset mapping. Include that output in generated launches.
tasks.named('vscode') {
	def launchFile = layout.projectDirectory.file('.vscode/launch.json').asFile
	doLast {
		def launch = new groovy.json.JsonSlurper().parse(launchFile)
		launch.configurations.each { config ->
			config.preLaunchTask = 'Fabric: prepare debug resources'
			config.classPaths = ['${workspaceFolder}/build/classes/java/main',
				'${workspaceFolder}/build/classes/java/client', '${workspaceFolder}/build/resources/main',
				'${workspaceFolder}/build/resources/client', '$Auto']
		}
		launchFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launch)) + '\n'
	}
}

// Small executable geometry checks, using the client's existing dependencies.
sourceSets {
	portalGlowTest {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

tasks.register('checkPortalGlow', JavaExec) {
	group = 'verification'
	description = 'Checks portal glow orientation and one-sided visibility for both portal axes.'
	classpath = sourceSets.portalGlowTest.runtimeClasspath
	mainClass = 'naturality.client.particle.PortalGlowGeometryTest'
}

tasks.named('check') {
	dependsOn tasks.named('checkPortalGlow')
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
















