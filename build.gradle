plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'MixinSquared'
		url = 'https://maven.bawnorton.com/releases'
		content { includeGroup 'com.github.bawnorton.mixinsquared' }
	}
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/'
		content { includeGroup 'com.terraformersmc' }
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"naturality" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Tests are kept locally and are absent from a fresh Git checkout.
// The override also permits validating the public build without moving local files.
def localTestsEnabled = providers.gradleProperty('localTests').getOrElse('true').toBoolean()
    && file('src/gametest/resources/naturality-tests.json').isFile()

fabricApi {
	if (localTestsEnabled) configureTests {
		createSourceSet = true
		modId = 'naturality-tests'
		enableGameTests = false
		enableClientGameTests = true
		clearRunDirectory = false
	}
	configureDataGeneration {
		client = true
	}
}

if (localTestsEnabled) {
    def clientTestCatalog = new groovy.json.JsonSlurper().parseText(providers.fileContents(
        layout.projectDirectory.file('src/gametest/resources/naturality-tests.json')).asText.get())
    def clientTestNames = clientTestCatalog.checks.collect { it.id } + clientTestCatalog.groups.keySet() + ['all']
    tasks.register('listClientTests') {
        group = 'verification'
        description = 'Lists focused client checks, their fixture requirements and compatibility groups without launching Minecraft.'
        def checks = clientTestCatalog.checks.collect { "${it.id.padRight(28)} ${it.fixture}".toString() }
        def groups = clientTestCatalog.groups.collect { k, v -> "${k}: ${v.join(', ')}".toString() }
        doLast { checks.each { println it }; groups.each { println it } }
    }

    // Explicit suite selection prevents a small visual change from running every test.
    tasks.named('runClientGameTest') {
        // Bound the child client from Gradle, including hangs that prevent test-thread deadlines.
        timeout = java.time.Duration.ofMinutes(providers.gradleProperty('clientTestTimeoutMinutes').getOrElse('10').toLong())
        systemProperty 'naturality.test.suites', providers.gradleProperty('clientTests').getOrElse('')
        systemProperty 'naturality.test.vanillaSnapshot', layout.buildDirectory.file('vanilla-registry-snapshot.json').get().asFile.absolutePath
        if (providers.gradleProperty('clientTests').getOrElse('').split(',').any { it.trim() in ['feature-startup', 'all'] }) {
            dependsOn 'writeVanillaRegistrySnapshot'
        }
        systemProperty 'naturality.test.muteAudio', 'true'
        def resultFile = layout.buildDirectory.file('client-test-results.json').get().asFile
        systemProperty 'naturality.test.result', resultFile.absolutePath
        doFirst {
            java.nio.file.Files.deleteIfExists(resultFile.toPath())
            def selection = systemProperties['naturality.test.suites'].toString().split(',', -1).collect { it.trim() }
            def valid = clientTestNames
            if (selection.any { !valid.contains(it) }) {
                throw new GradleException('Choose focused checks with -PclientTests=<id>; run listClientTests for available checks and groups.')
            }
        }
        doLast {
            // Some optional client mods catch failures and exit with status zero.
            // Require evidence from the selector, not just a successful process exit.
            if (!resultFile.isFile()) throw new GradleException('The client did not finish its selected checks; inspect the client log.')
            def result = new groovy.json.JsonSlurper().parse(resultFile)
            def expected = new LinkedHashSet()
            systemProperties['naturality.test.suites'].toString().split(',').each { value ->
                def id = value.trim()
                if (id == 'all') expected.addAll(clientTestCatalog.checks.collect { it.id })
                else if (clientTestCatalog.groups.containsKey(id)) expected.addAll(clientTestCatalog.groups[id])
                else expected.add(id)
            }
            if (result.completed != true || result.checks.toSet() != expected)
                throw new GradleException('The client result does not cover every selected check.')
        }
    }
} else {
    tasks.register('listClientTests') {
        group = 'verification'
        description = 'Reports that local-only tests are unavailable or disabled.'
        doLast { logger.lifecycle('Local tests are absent or disabled. src/gametest is intentionally not stored in Git.') }
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Select Iris's injected sky guard by owner/name, without generated handler hashes.
	include(implementation(annotationProcessor('com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7')))

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Available in the development client without bundling it in Naturality.
	clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Optional local compatibility test dependency; never bundled in the mod.
	if (providers.gradleProperty('sodiumTestJar').isPresent()) {
		clientRuntimeOnly files(providers.gradleProperty('sodiumTestJar').get())
	}
	// One local jar path per line; keep compatibility fixtures out of published dependencies.
	if (providers.gradleProperty('compatibilityModsFile').isPresent()) {
		def manifest = file(providers.gradleProperty('compatibilityModsFile').get())
		def jars = manifest.readLines('UTF-8').collect { it.replace('\uFEFF', '').trim() }
			.findAll { !it.isEmpty() && !it.startsWith('#') }.collect { file(it) }
		jars.each { jar ->
			if (!jar.isFile() || !jar.name.endsWith('.jar'))
				throw new GradleException("Compatibility fixture is not a jar: $jar")
		}
		clientRuntimeOnly files(jars)
	}
}

// A separate JVM with no Fabric launcher gives the compatibility suite an actual vanilla baseline.
if (localTestsEnabled) tasks.register('writeVanillaRegistrySnapshot', JavaExec) {
    group = 'verification'
    dependsOn 'gametestClasses'
    classpath = sourceSets.gametest.output + sourceSets.main.runtimeClasspath
    mainClass = 'naturality.test.VanillaRegistrySnapshot'
    args layout.buildDirectory.file('vanilla-registry-snapshot.json').get().asFile.absolutePath
}

// Blockbench's old EntityModel API is ignored; its geometry method remains authoritative.
def generateEntityGeometry = { taskName, exportName, className, partNames, aliases -> tasks.register(taskName) {
    def exportFile = layout.projectDirectory.file('resources/entity models/' + exportName + '.java')
    inputs.file(exportFile)
    def generatedDir = layout.buildDirectory.dir('generated/sources/' + exportName)
    outputs.dir(generatedDir)
    doLast {
        def source = exportFile.asFile.getText('UTF-8')
        def signature = source =~ /public\s+static\s+LayerDefinition\s+createBodyLayer\s*\(\s*\)\s*\{/
        if (!signature.find()) throw new GradleException(exportName + ' export must contain public static LayerDefinition createBodyLayer().')
        int start = signature.start()
        int cursor = signature.end()
        int depth = 1
        while (cursor < source.length() && depth > 0) {
            char character = source.charAt(cursor++)
            if (character == '{' as char) depth++
            if (character == '}' as char) depth--
        }
        if (depth != 0) throw new GradleException('Unbalanced createBodyLayer() in ' + exportName + ' export.')
        def geometry = source.substring(start, cursor)
        // Blockbench names every part, even leaves never referenced again. Keep
        // addOrReplaceChild calls but omit unused bindings in generated Java.
        def geometryCode = geometry.replaceAll(/"(?:\\.|[^"\\])*"/, '""')
        def partBindings = (geometry =~ /\bPartDefinition\s+(\w+)\s*=/).collect { it[1] }
        partBindings.each { name ->
            if ((geometryCode =~ /\b${java.util.regex.Pattern.quote(name)}\b/).count == 1) {
                geometry = geometry.replaceFirst(/\bPartDefinition\s+${java.util.regex.Pattern.quote(name)}\s*=\s*/, '')
            }
        }
        partNames.each { name ->
            if (!geometry.contains('"' + name + '"'))
                throw new GradleException(exportName + ' export must retain animated part name: ' + name)
        }
        aliases.each { original, mapped -> geometry = geometry.replace('"' + original + '"', '"' + mapped + '"') }
        if (!aliases.isEmpty()) {
            geometry = geometry.replace('return LayerDefinition.create',
                'partdefinition.getChild("head").addOrReplaceChild("hat", CubeListBuilder.create(), PartPose.ZERO);\nreturn LayerDefinition.create')
        }
        def legacyOutput = new File(generatedDir.get().asFile, 'naturality/client/entity/' + className + '.java')
        if (legacyOutput.exists() && !legacyOutput.delete()) throw new GradleException('Cannot remove obsolete generated geometry: ' + legacyOutput)
        def output = new File(generatedDir.get().asFile, 'naturality/client/entities/maddened/' + className + '.java')
        output.parentFile.mkdirs()
        output.setText('''package naturality.client.entities.maddened;
import net.minecraft.client.model.geom.PartPose;
import net.minecraft.client.model.geom.builders.*;
/** Generated from the artist entity export. Do not edit. */
''' + 'public final class ' + className + ' {\nprivate ' + className + '() {}\n' + geometry + '\n}\n', 'UTF-8')
    }
} }
def generateMaddenedCreeperModel = generateEntityGeometry('generateMaddenedCreeperModel', 'maddened_creeper',
    'MaddenedCreeperGeometry', ['Body', 'Head', 'leg0', 'leg1', 'leg2', 'leg3'], [:])
sourceSets.client.java.srcDir(generateMaddenedCreeperModel)
def generateMaddenedZombieModel = generateEntityGeometry('generateMaddenedZombieModel', 'maddened_zombie',
    'MaddenedZombieGeometry', ['Body', 'Head', 'RightArm', 'LeftArm', 'RightLeg', 'LeftLeg'],
    [Body:'body', Head:'head', RightArm:'right_arm', LeftArm:'left_arm', RightLeg:'right_leg', LeftLeg:'left_leg'])
sourceSets.client.java.srcDir(generateMaddenedZombieModel)

def generateChorusFlowerModel = tasks.register('generateChorusFlowerModel') {
	description = 'Converts both artist chorus flower exports into game-ready models.'
	inputs.files('resources/block models/chorus_flower.json', 'resources/block models/chorus_flower_bloom.json')
	outputs.dir(layout.buildDirectory.dir('generated/chorusFlowerResources'))
	doLast {
		inputs.files.each { source ->
		def model = new groovy.json.JsonSlurper().parse(source)
		model.textures.replaceAll { key, value ->
			value.startsWith('resources:') ? value.replaceFirst('resources:', 'naturality:') : value
		}
		// Older exports leave the stem texture in the vanilla namespace.
		if (model.textures['3'] == 'block/chorus_plant') {
			model.textures['3'] = 'naturality:block/chorus_plant'
		}
		if (model.textures.particle == '#texture' && !model.textures.containsKey('texture')) {
			model.textures.particle = '#4'
		}
		model.elements.each { element ->
			element.faces.entrySet().removeIf { it.value.texture == '#missing' }
		}
		def output = new File(outputs.files.singleFile, 'assets/naturality/models/block/' + source.name)
		output.parentFile.mkdirs()
		output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(model)) + '\n', 'UTF-8')
		}
	}
}

// Feature-owned packages must retain their original relative application order.
// Mixin sorts equal-priority injections by registration order, so grouping every
// feature into one configuration can change behavior at shared injection points.
def mixinRegistryFile = layout.projectDirectory.file('src/main/mixins.json')
def modTemplateFile = layout.projectDirectory.file('src/main/resources/fabric.mod.json')
def mixinRegistryText = providers.fileContents(mixinRegistryFile).asText.get()
def modTemplateText = providers.fileContents(modTemplateFile).asText.get()
def mixinModVersion = project.version.toString()
def generateMixinResources = tasks.register('generateMixinResources') {
    description = 'Emits ordered mixin configurations and mod metadata from the feature registry.'
    inputs.file(mixinRegistryFile)
    inputs.file(modTemplateFile)
    inputs.property('version', mixinModVersion)
    def destination = layout.buildDirectory.dir('generated/mixinResources')
    outputs.dir(destination)
    doLast {
        def registry = new groovy.json.JsonSlurper().parseText(mixinRegistryText)
        def metadata = new groovy.json.JsonSlurper().parseText(modTemplateText)
        def directory = destination.get().asFile
        directory.mkdirs()
        // Delete only this generator's named outputs, never arbitrary directories.
        directory.listFiles().each { output ->
            if (output.isFile() && (output.name == 'fabric.mod.json'
                    || output.name.startsWith('naturality.ordered.') && output.name.endsWith('.mixins.json'))) {
                if (!output.delete()) throw new GradleException("Cannot replace generated mixin resource: $output")
            }
        }
        def configs = []
        ['main', 'client'].each { side ->
            def names = registry[side]
            if (names.toSet().size() != names.size()) throw new GradleException("Duplicate $side mixin registration")
            def groups = []
            names.each { name ->
                def split = name.lastIndexOf('.')
                def owner = name.substring(0, split)
                def simple = name.substring(split + 1)
                if (!owner.endsWith('.mixins') && !owner.contains('.mixins.')) throw new GradleException("Mixin must have a dedicated hook package: $name")
                if (groups.isEmpty() || groups.last().owner != owner) groups.add([owner: owner, names: []])
                groups.last().names.add(simple)
            }
            groups.eachWithIndex { group, index ->
                def config = new LinkedHashMap(registry.defaults)
                config['package'] = group.owner
                config[side == 'client' ? 'client' : 'mixins'] = group.names
                def filename = "naturality.ordered.${side}_${index.toString().padLeft(3, '0')}.mixins.json".toString()
                new File(directory, filename).setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n', 'UTF-8')
                configs.add(side == 'client' ? [config: filename, environment: 'client'] : filename)
            }
        }
        metadata.version = mixinModVersion
        metadata.mixins = configs
        new File(directory, 'fabric.mod.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n', 'UTF-8')
    }
}
// The source descriptor is the template; only the generated descriptor is packaged.
sourceSets.main.resources.exclude('fabric.mod.json')


processResources {
    from(generateMixinResources)
	from(generateChorusFlowerModel)
	// The artist texture also replaces every vanilla chorus-plant sprite reference.
	from('resources/textures/block') {
		into 'assets/minecraft/textures/block'
		include 'chorus_plant.png', 'chorus_plant.png.mcmeta'
	}
	// Artist-facing resources keep Minecraft's layout beneath the mod namespace.
	from('resources') {
		into 'assets/naturality'
		exclude '**/README.txt', '**/.gitkeep', 'block models/**', 'entity models/**'
	}

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Keep production API, type-safety and redundant-cast warnings visible in builds.
['compileJava', 'compileClientJava'].each { taskName ->
	tasks.named(taskName, JavaCompile) {
		options.compilerArgs.addAll(['-Xlint:deprecation,unchecked,cast', '-Werror'])
	}
}

tasks.register('writeJavaAuditClasspath') {
	group = 'verification'
	description = 'Exports each Java source set and its classpath for the warning audit.'
	dependsOn tasks.named('clientClasses')
	def auditSets = sourceSets.collect { set ->
		[name: set.name, sourceDirs: set.allJava.srcDirs.collect { it.absolutePath }, classpath: set.compileClasspath]
	}
	inputs.files(auditSets.collect { it.classpath })
	inputs.property('sourceRoots', auditSets.collect { [name: it.name, sourceDirs: it.sourceDirs] })
	outputs.file(layout.buildDirectory.file('java-audit/source-sets.json'))
	doLast {
		def output = outputs.files.singleFile
		output.parentFile.mkdirs()
		def manifest = auditSets.collect { [name: it.name, sourceDirs: it.sourceDirs, classpath: it.classpath.asPath] }
		output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n'
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// launch.cfg is shared by normal and alternate build directories. Refresh its
// classpath groups whenever launch setup runs, including VS Code's F5 preflight.
tasks.named('generateDLIConfig') {
	outputs.upToDateWhen { false }
}

tasks.register('prepareDebugLaunch') {
	group = 'fabric'
	description = 'Builds debug resources and refreshes/verifies Fabric launch metadata.'
	dependsOn 'classes', 'clientClasses', 'configureClientLaunch'
	if (localTestsEnabled) dependsOn 'gametestClasses'
	def launchConfig = layout.projectDirectory.file('.gradle/loom-cache/launch.cfg').asFile
	def modOutputs = (sourceSets.main.output.files + sourceSets.client.output.files).collect { it.absolutePath }
	doLast {
		def property = launchConfig.readLines().find { it.trim().startsWith('fabric.classPathGroups=') }
		def groups = property == null ? [] : property.trim().substring('fabric.classPathGroups='.length())
			.split(java.util.regex.Pattern.quote(File.pathSeparator + File.pathSeparator))
			.collect { it.split(java.util.regex.Pattern.quote(File.pathSeparator)).toList() }
		if (!groups.any { it.containsAll(modOutputs) }) {
			throw new GradleException('Fabric launch metadata does not group the current main/client outputs. Debug launch stopped to avoid missing shaders.')
		}
		logger.lifecycle('Verified Fabric debug classpath: main/client classes and resources belong to the same mod.')
	}
}

// VS Code's Java compiler copies source resources but does not execute our
// processResources asset mapping. Include that output in generated launches.
tasks.named('vscode') {
	def launchFile = layout.projectDirectory.file('.vscode/launch.json').asFile
	doLast {
		def launch = new groovy.json.JsonSlurper().parse(launchFile)
		launch.configurations.each { config ->
			config.preLaunchTask = 'Fabric: prepare debug resources'
			config.classPaths = ['${workspaceFolder}/build/classes/java/main',
				'${workspaceFolder}/build/classes/java/client', '${workspaceFolder}/build/resources/main',
				'${workspaceFolder}/build/resources/client', '$Auto']
		}
		launchFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launch)) + '\n'
	}
}

// Plain Java checks share the gametest source set but still run without launching Minecraft.
if (localTestsEnabled) {
    tasks.register('checkPlayerSwimming', JavaExec) {
        group = 'verification'
        description = 'Checks player swimming directions and tilt policy without launching Minecraft.'
        classpath = sourceSets.gametest.runtimeClasspath
        mainClass = 'naturality.systems.swimming.PlayerSwimmingMathTest'
    }

    tasks.register('checkPlayerRotation', JavaExec) {
        group = 'verification'
        description = 'Checks oriented player geometry and swept collisions without launching Minecraft.'
        classpath = sourceSets.gametest.runtimeClasspath
        mainClass = 'naturality.systems.rotation.PlayerRotationGeometryTest'
    }

    tasks.register('checkPortalGlow', JavaExec) {
        group = 'verification'
        description = 'Runs the existing portal, water, rope and weather math checks without launching Minecraft.'
        classpath = sourceSets.gametest.runtimeClasspath
        mainClass = 'naturality.client.particle.PortalGlowGeometryTest'
    }

    tasks.named('check') {
        dependsOn tasks.named('checkPortalGlow')
    }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}



